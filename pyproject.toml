[tool.poetry]
name = "lcv-jdoubling-maestria"
version = "0.1.0"
description = "Determination of J-coupling constants for 1d NMR"
authors = ["angelAlk <angelalk@ciencias.unam.mx>"]
readme = "README.md"
packages = [{include = "lcv_jdoubling_maestria"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.12"
nmrsim = "^0.6.0.post1"
numpy = "^1.26.2"
matplotlib = "^3.8.2"
tensorflow = "^2.15.0"
pandas = "^2.1.3"
gpflow = "^2.9.0"
scikit-learn = "^1.3.2"
seaborn = "^0.13.0"
scipy = "^1.11.4"
ipympl = "^0.9.3"


[tool.poetry.group.dev.dependencies]
ipykernel = "^6.27.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
